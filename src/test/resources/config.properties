# config.properties - Cricbuzz Automation Framework Configuration

# ============================================
# BROWSER & DRIVER CONFIGURATION
# ============================================
cricbuzz.browser=chrome

# Implicit wait timeout in seconds (for WebDriver implicit wait)
cricbuzz.implicitWaitSeconds=10

# Explicit wait timeout in seconds (for WebDriverWait explicit waits)
cricbuzz.explicitWaitSeconds=30

# ============================================
# APPLICATION URLS
# ============================================
# Base URL for Cricbuzz website
cricbuzz.baseUrl=https://www.cricbuzz.com/

# Men's Rankings page
cricbuzz.mensRankingsUrl=https://www.cricbuzz.com/cricket-stats/icc-rankings/men/batting

# Women's Rankings page
cricbuzz.womensRankingsUrl=https://www.cricbuzz.com/cricket-stats/icc-rankings/women/batting

# PSL Series page 2026
cricbuzz.pslSeriesUrl=https://www.cricbuzz.com/cricket-series/11537/pakistan-super-league-2026

# IPL Series page 2026
cricbuzz.iplSeriesUrl=https://www.cricbuzz.com/cricket-series/9241/Indian-Premier-League-2026

# ============================================
# TEST DATA CONFIGURATION
# ============================================
# Number of top players to display in statistics (e.g., most runs, most wickets)
cricbuzz.topPlayersCount=10

# ============================================
# EMAIL CONFIGURATION
# ============================================
# Sender email address
cricbuzz.fromEmail=bm.asbs@gmail.com

# Gmail App Password (or other SMTP password)
cricbuzz.appPassword=eqhvyqiditedtmcsk

# Recipient email (defaults to bm13.asb@gmail.com if not provided)
cricbuzz.receiver=bm13.asb@gmail.com